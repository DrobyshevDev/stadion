name: Publish to PyPI

# Publishes to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API token or secret is stored here.
# See: https://docs.pypi.org/trusted-publishers/
#
# PyPI matches the publisher on owner, repository, workflow filename and
# environment, exactly and without following redirects. If any of those four
# changes — including renaming this file or moving the repository between
# accounts — the trusted publisher has to be updated by hand in the project's
# settings on PyPI, and the next release fails after the tag is already pushed.

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag matches the version in pyproject.toml
        # A tag that disagrees with the packaged version publishes something
        # nobody asked for, and PyPI will not let it be replaced afterwards.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag $tag, pyproject $version"
          test "$tag" = "$version"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
