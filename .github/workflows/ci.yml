name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: lint + tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # decisionrl brings PyTorch; the CPU wheel is a fraction of the default
        # one and nothing here trains a network.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: pytest -q --cov=stadion --cov-report=term-missing --cov-report=xml
      # Codecov replaces a hand-written badge with a number recomputed on every
      # run. It uploads once, from one interpreter, so parallel jobs cannot race
      # to decide what the figure is. Adding CODECOV_TOKEN is what turns the
      # upload from decoration into a check that can fail.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix['python-version'] == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

  verify-optima:
    name: dynamic programs agree with their own policies
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Verify
        # Every score in this library is measured against the optimum, so a wrong
        # recurrence would move the whole scale without failing anything else.
        # This is the one check that can catch it.
        run: stadion verify --instances 5 --episodes 4000

  reference-controls:
    name: classical scores 0 and the optimum scores 1
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run the reference arms through the ordinary evaluation path
        run: |
          set -euo pipefail
          for task in inventory pricing queueing energy supply-chain joint-pricing; do
            for agent in classical optimum; do
              stadion run "$task" --agent "$agent" --instances 10 --episodes 8
            done
          done

      # The headroom table in both READMEs is forty-eight hand-typed numbers,
      # and they are the most specific claims published anywhere here: "+0.4% on
      # inventory" is what the next paragraph leans on to say that an agent
      # reporting a large improvement there has a bug rather than a policy.
      #
      # This recomputes `inventory` in full -- seven seconds, at the instance and
      # episode counts the README itself quotes -- and checks the cheap claims
      # around it. `--all` recomputes every row -- 855s, of which `joint-pricing`
      # is 626 -- and runs weekly in headroom.yml rather than here, because
      # fourteen minutes in front of every push is not what this repository
      # needs when a branch already has to be brought up to date repeatedly.
      - name: The headroom table is the table the benchmark produces
        run: python scripts/check_readme.py

  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-and-test, verify-optima, reference-controls]
    steps:
      # One aggregate check to require in branch protection. The matrix jobs
      # carry their operating system and Python version in the name, so every
      # one of them is a separate context that changes the moment the matrix
      # does - and a required check that silently stops matching is a required
      # check that stopped requiring anything.
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more jobs failed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "All checks passed."
