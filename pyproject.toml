[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The import package is `stadion`; the distribution carries the `-rl` suffix
# because PyPI's `stadion` belongs to an unrelated causal-modelling package.
name = "stadion-rl"
version = "0.1.0"
description = "A proving ground for operational decisions: an agent is scored against the tuned classical method and the exact optimum, with a confidence interval."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Denis Drobyshev", email = "drobishev.denis@icloud.com" }]
keywords = [
    "reinforcement-learning",
    "llm-agents",
    "benchmark",
    "evaluation",
    "operations-research",
    "inventory",
    "pricing",
    "queueing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21",
    "decisionrl>=0.4",
]

[project.optional-dependencies]
llm = ["glia-agents>=0.8"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "hypothesis>=6.0",
]

[project.scripts]
stadion = "stadion.cli:main"

[project.urls]
Homepage = "https://github.com/DrobyshevDev/stadion"
Repository = "https://github.com/DrobyshevDev/stadion"
Issues = "https://github.com/DrobyshevDev/stadion/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/stadion"]

[tool.hatch.build.targets.sdist]
include = ["src/stadion", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: full-length evaluations (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stadion"]

[tool.mypy]
# Analysis target, not the support floor. NumPy's current stubs use PEP 695
# `type` statements, which mypy refuses to parse under an older target, so the
# analysis runs at 3.12 while runtime support for 3.10 is unchanged and is
# exercised by the 3.10 test job in CI.
python_version = "3.12"
files = ["src/stadion"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

# NumPy's stubs are version-unstable across the supported Python range; treating
# the package as Any keeps local and CI results identical.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "decisionrl", "decisionrl.*"]
follow_imports = "skip"
ignore_missing_imports = true
